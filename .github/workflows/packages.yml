name: Packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-packages:
    name: Build DEB and RPM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev rpm

      - name: Build binary
        run: |
          make clean
          make -j$(nproc)

      - name: Build distro packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="2.0.0-dev"
          make package-all VERSION="$VERSION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spf-packages
          path: |
            *.deb
            *.rpm
